<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EatWell</title>
<link rel="icon" href="icon.png">
<style>
:root { --bg:#FBFBFA; --raised:#FFFFFF; --text:#1C201E; --text2:#5F6662; --line:#E3E6E4; --accent:#0E7A57; color-scheme: light dark; }
@media (prefers-color-scheme: dark) { :root { --bg:#101312; --raised:#1C211F; --text:#EDF0EE; --text2:#A5ADA9; --line:#2A302D; --accent:#47C08F; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
main { max-width: 680px; margin: 0 auto; padding: 32px 20px 64px; }
nav { display:flex; align-items:center; gap:12px; margin-bottom: 32px; }
nav img { width:44px; height:44px; border-radius:10px; }
nav a { color:var(--text); text-decoration:none; font-weight:700; }
nav .links { margin-left:auto; display:flex; gap:16px; font-size:15px; }
nav .links a { font-weight:500; color:var(--text2); }
h1 { font-size: 32px; line-height:1.2; margin: 0 0 16px; }
h2 { font-size: 22px; margin: 36px 0 8px; }
h3 { font-size: 18px; margin: 24px 0 4px; }
p, li { color: var(--text); }
em { color: var(--text2); }
a { color: var(--accent); }
table { width:100%; border-collapse: collapse; margin: 12px 0; font-size: 15px; }
th, td { text-align:left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.hero { text-align:center; padding-top: 24px; }
.hero img { width: 160px; height:160px; border-radius: 36px; }
.hero p { color: var(--text2); font-size: 19px; }
footer { margin-top: 48px; font-size: 14px; color: var(--text2); }
</style>
</head>
<body>
<main>

<div class="hero"><img src="icon.png" alt="EatWell icon"><h1>EatWell</h1>
<p>The calories, protein, carbs and fat of what's on the menu at the UK's biggest restaurant chains. Search it, build a basket, or share a screenshot of your order.</p>
<p><a href="support.html">Support</a> &nbsp;·&nbsp; <a href="privacy.html">Privacy policy</a></p></div>
<footer>EatWell is not affiliated with, or endorsed by, any of the restaurants it lists.</footer>
</main>
</body>
</html>
